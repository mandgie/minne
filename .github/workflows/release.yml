name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      # The `secrets` context is not available in a step's `if:`, so the
      # decision is made once here and read back as `env.HAS_SIGNING`.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_NOTARY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      - name: Check the tag matches VERSION
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($expected)" >&2
            exit 1
          fi

      # Same checks as CI — a tag must not ship anything red.
      - name: Install brain dependencies
        run: bun install --frozen-lockfile
        working-directory: brain

      - name: Typecheck brain
        run: bun run typecheck
        working-directory: brain

      - name: Test brain
        run: bun test
        working-directory: brain

      - name: Build app
        run: swift build
        working-directory: app

      - name: Test app
        run: swift test
        working-directory: app

      # Without these secrets the job still runs and publishes an *unsigned*
      # dmg. Signing needs the certificate in a keychain, not just an env var,
      # so the identity and notary profile are exported only once that keychain
      # exists.
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/minne-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Default keychain, so codesign and notarytool both find it without
          # a --keychain flag and scripts/release.sh stays flag-free.
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          xcrun notarytool store-credentials minne-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"
          echo "MINNE_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "MINNE_NOTARY_PROFILE=minne-notary" >> "$GITHUB_ENV"

      - name: Build the dmg
        run: scripts/release.sh

      # A stable-named copy rides along so the site's Download button
      # (releases/latest/download/Minne.dmg) tracks every release without a
      # redeploy.
      - name: Stable asset name
        if: env.HAS_SIGNING == 'true'
        run: cp build/Minne-*.dmg build/Minne.dmg

      # Publish ONLY what is signed and notarized. Without the signing
      # secrets this job still proves the tag builds green, but it must never
      # attach an unsigned dmg to the release — on 2026-08-19 it silently
      # replaced the notarized v0.1.3 asset with an unsigned rebuild, which
      # Gatekeeper quarantines. The authoritative unsigned-secrets path is the
      # local scripts/release.sh + `gh release create`.
      - uses: softprops/action-gh-release@v2
        if: env.HAS_SIGNING == 'true'
        with:
          files: |
            build/Minne-*.dmg
            build/Minne.dmg
          generate_release_notes: true

      - name: Unsigned build — release not published
        if: env.HAS_SIGNING != 'true'
        run: echo "No signing secrets; tag verified green but the release is published locally. See scripts/release.sh."
