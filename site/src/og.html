<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minne — og card source</title>
<!-- Source for assets/og.png. Serve the site and screenshot this page at
     1200×630 (see site/README.md). -->
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og {
    position: relative;
    width: 1200px;
    height: 630px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 76px;
    isolation: isolate;
    background: var(--void);
  }
  .og .hero__field { position: absolute; inset: 0; z-index: -2; }
  .og .hero__field { animation: none; }
  .og .hero__veil { position: absolute; inset: 0; z-index: -1; }
  .og__mark {
    display: flex; align-items: center; gap: 0.5rem;
    font-family: var(--display); font-weight: 600; font-size: 30px;
    letter-spacing: -0.02em; color: var(--chalk); margin: 0 0 26px;
  }
  .og__mark .spark { width: 30px; height: 30px; }
  .og__title {
    font-family: var(--display); font-weight: 600; color: var(--chalk);
    font-size: 70px; line-height: 1.0; letter-spacing: -0.042em;
    margin: 0; max-width: 17ch;
  }
  .og__sub {
    font-family: var(--serif); font-size: 25px; line-height: 1.5;
    color: var(--prose); margin: 26px 0 0; max-width: 30ch;
  }
  .og__meta {
    position: absolute; left: 76px; bottom: 52px;
    font-family: var(--mono); font-size: 17px; color: var(--mute); margin: 0;
  }
</style>
</head>
<body>
<div class="og">
  <div class="hero__field" aria-hidden="true"></div>
  <div class="hero__veil" aria-hidden="true"></div>
  <p class="og__mark">
    <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c.6 4.6 1.8 6.9 4.3 8.2 1.4.7 3.2 1.2 6.2 1.6v1.4c-3 .4-4.8.9-6.2 1.6-2.5 1.3-3.7 3.6-4.3 8.2h-1.4c-.6-4.6-1.8-6.9-4.3-8.2-1.4-.7-3.2-1.2-6.2-1.6v-1.4c3-.4 4.8-.9 6.2-1.6C8.8 8.4 10 6.1 10.6 1.5Z"/></svg>
    minne
  </p>
  <h1 class="og__title">Tap one key. Get the reply you would have written.</h1>
  <p class="og__sub">Minne remembers what you work on and writes from it — on your Mac only.</p>
  <p class="og__meta">macOS · open source · nothing uploaded</p>
</div>
</body>
</html>
